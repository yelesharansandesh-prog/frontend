<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePlane Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
    }
    header {
      background: #172554;
      color: white;
      padding: 22px 6%;
    }
    main { max-width: 1000px; margin: 35px auto; padding: 0 20px; }
    h1 { margin: 0; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000b;
    }
    .card p { color: #64748b; }
    .amount { font-size: 28px; font-weight: bold; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 12px 18px;
      cursor: pointer;
    }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>InvoicePlane</h1>
    <p>Invoice and payment dashboard</p>
  </header>
  <main>
    <h2>Dashboard</h2>
    <div class="cards">
      <section class="card">
        <p>Total invoices</p>
        <div class="amount" id="invoices">0</div>
      </section>
      <section class="card">
        <p>Clients</p>
        <div class="amount" id="clients">0</div>
      </section>
      <section class="card">
        <p>Payments received</p>
        <div class="amount" id="payments">₹0</div>
      </section>
    </div>
    <h2>Backend connection</h2>
    <button onclick="checkBackend()">Check backend</button>
    <p id="status">Backend connection has not been checked.</p>
  </main>
  <script>
    async function checkBackend() {
      const status = document.getElementById("status");
      status.textContent = "Connecting...";
      try {
        const response = await fetch(
          "https://YOUR-BACKEND-URL/health"
        );
        if (!response.ok) throw new Error("Server error");
        const data = await response.json();
        status.textContent = "Backend connected: " + data.status;
      } catch (error) {
        status.textContent =
          "Backend not connected yet. Deploy your backend and update its URL.";
      }
    }
  </script>
</body>
</html>
